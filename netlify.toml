# Netlify configuration file

# This redirect rule tells Netlify to serve index.html for all routes
# This allows client-side routing to work properly with React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Set default headers for better security and performance
[[headers]]
  for = "/*"
    [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"

# Build settings
[build]
  command = "npm run build"
  publish = "dist"

# Handle 404 errors by redirecting to index.html
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200